# Runs the upstream checker on every file in statements/, one CI job per file (see check-files.yml).
# Statements: a formal statement keeps exactly one sorry (the body of main) by design.
name: statement-check

on:
  push:
    branches: [main]
    paths: ["statements/**", ".github/workflows/statement-check.yml", ".github/workflows/check-files.yml"]
  pull_request:
    paths: ["statements/**", ".github/workflows/statement-check.yml", ".github/workflows/check-files.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statement-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    name: statements
    uses: ./.github/workflows/check-files.yml
    with:
      dir: statements
