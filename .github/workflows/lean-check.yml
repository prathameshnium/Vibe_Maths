# Runs the upstream checker on every file in proofs/, one CI job per file (see check-files.yml).
# Proofs: theorem OMA.solution (or OMA.disproof) with no sorry.
name: lean-check

on:
  push:
    branches: [main]
    paths: ["proofs/**", ".github/workflows/lean-check.yml", ".github/workflows/check-files.yml"]
  pull_request:
    paths: ["proofs/**", ".github/workflows/lean-check.yml", ".github/workflows/check-files.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    name: proofs
    uses: ./.github/workflows/check-files.yml
    with:
      dir: proofs
