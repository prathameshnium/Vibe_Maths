# Runs the upstream checker on every file in reductions/, one CI job per file (see check-files.yml).
# Reductions: H1 ... Hk definitions and main : H1 -> ... -> target, with no sorry.
name: reduction-check

on:
  push:
    branches: [main]
    paths: ["reductions/**", ".github/workflows/reduction-check.yml", ".github/workflows/check-files.yml"]
  pull_request:
    paths: ["reductions/**", ".github/workflows/reduction-check.yml", ".github/workflows/check-files.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reduction-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    name: reductions
    uses: ./.github/workflows/check-files.yml
    with:
      dir: reductions
